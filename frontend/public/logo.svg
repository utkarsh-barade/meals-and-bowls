<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <!-- Circular Outer Border -->
  <circle cx="150" cy="150" r="138" fill="none" stroke="#111827" stroke-width="12" />

  <!-- Crossed Spoon & Fork Icon -->
  <g fill="#111827" transform="translate(150, 90) scale(0.95)">
    <!-- Spoon (Left to Right Diagonal) -->
    <g transform="rotate(45)">
      <ellipse cx="0" cy="-32" rx="13" ry="20" />
      <rect x="-3" y="-12" width="6" height="70" rx="3" />
    </g>
    <!-- Fork (Right to Left Diagonal) -->
    <g transform="rotate(-45)">
      <path d="M-13,-50 L-13,-28 C-13,-20 -7,-14 0,-14 C7,-14 13,-20 13,-28 L13,-50 M-6,-50 L-6,-28 M0,-50 L0,-28 M6,-50 L6,-28" fill="none" stroke="#111827" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-3" y="-14" width="6" height="72" rx="3" fill="#111827"/>
    </g>
  </g>

  <!-- Typography -->
  <text x="150" y="176" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" letter-spacing="3" fill="#111827">MEALS</text>
  <text x="150" y="208" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" letter-spacing="1" fill="#111827">&amp;</text>
  <text x="150" y="242" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="30" letter-spacing="3" fill="#111827">BOWLS</text>
</svg>
