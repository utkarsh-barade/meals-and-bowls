spring:
  application:
    name: meals-bowls


  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/meals_bowls}


server:
  port: ${PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-must-be-256-bits-long-at-minimum}
    expiry-ms: ${JWT_EXPIRY_MS:86400000}

  admin:
    mobile: ${ADMIN_MOBILE:9999999999}
    password: ${ADMIN_PASSWORD:admin123}

  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}

  whatsapp:
    test-number: ${WHATSAPP_TEST_NUMBER:}

  notification:
    provider: ${NOTIFICATION_PROVIDER:WHATSAPP_GATEWAY}
    fast2sms-api-key: ${FAST2SMS_API_KEY:}

  wa-gateway:
    url: ${WA_GATEWAY_URL:http://localhost:3001}
    api-key: ${WA_GATEWAY_API_KEY:meals-bowls-secret}

logging:
  level:
    com.mealsbowls: DEBUG
    org.springframework.security: INFO
